name: Run Automaton Demo
on:
  workflow_dispatch:

jobs:
  automaton:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Ollama and run automaton
        run: bash run-demo.sh
